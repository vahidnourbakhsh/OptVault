name: optvault
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Core scientific packages
  - numpy>=1.20.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - matplotlib>=3.3.0
  - seaborn>=0.11.0

  # Optimization packages
  - pyomo>=6.9.0
  - pulp>=2.0.0
  - glpk>=5.0

  # Jupyter ecosystem
  - jupyter>=1.0.0
  - ipykernel
  - jupyterlab
  - notebook

  # Development tools
  - black>=21.0.0
  - pytest>=6.0.0
  - pytest-cov>=2.0.0
  - flake8>=3.8.0
  - mypy>=0.800
  - pre-commit>=3.0.0
  - isort>=5.0.0

  # Essential utilities (with flexible versions)
  - pip
  - setuptools
  - wheel
